name: Scorecard

# OpenSSF Scorecard measures this repository against the supply-chain practices
# it asks consumers to adopt. Publishing the score is the honest move: a
# repository that tells every other repository in the organization how to secure
# its builds should be measurable on the same scale.
#
# The checks that matter most here are Pinned-Dependencies (every `uses:` is a
# commit SHA), Token-Permissions (read-only by default, elevated per job),
# Dangerous-Workflow (no pull_request_target with a fork checkout) and
# Branch-Protection.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '43 2 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Uploading the SARIF result into code scanning.
      security-events: write
      # Scorecard reads workflow run data to evaluate some checks.
      actions: read
      # Lets Scorecard publish the result to the public OpenSSF API so the
      # score is verifiable by anyone evaluating whether to depend on this.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: results.sarif
