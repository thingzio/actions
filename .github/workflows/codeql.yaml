name: CodeQL

# CodeQL's `actions` analysis is written for exactly this kind of repository:
# it models workflow and composite-action semantics and finds expression
# injection, untrusted checkout and permission problems in them.
#
# It overlaps with zizmor in ci.yaml deliberately. The two use different
# analyses and neither is a superset of the other, and for a repository that
# other repositories delegate their build to, a second opinion on the security
# of the build definitions is worth the minutes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 4 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `actions` only. There is no Go application in this repository -- the
        # sole Go file is a fifteen-line fixture that prints a string, and its
        # module has no dependencies, so a Go analysis costs minutes and finds
        # nothing by construction. The Go extractor also rejects
        # `build-mode: none` and would need autobuild, adding a toolchain setup
        # for that same zero signal.
        #
        # Add `go` back, with `build-mode: autobuild`, the moment this
        # repository grows a real Go program.
        language: [actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          category: /language:${{ matrix.language }}
