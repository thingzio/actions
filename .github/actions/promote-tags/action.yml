name: Promote tags
description: >-
  Points the release tags at an already-attested digest. This is the last step
  of a build and the only one that makes an image publicly reachable by name.

# Digest-first publishing: the build pushes to a run-unique candidate tag, the
# attestations are signed against the resulting digests, and only then do the
# release tags move. A failed signing step therefore never leaves a published
# `latest`, and a re-run re-points the same tags at the same digest, so the
# operation is idempotent.
#
# `crane tag` re-points a tag at an existing manifest without pulling or pushing
# any layers, so promotion is a registry-side metadata change rather than a
# second upload that could produce a different digest.

inputs:
  image:
    description: Full image name including registry, without tag or digest
    required: true
  digest:
    description: Attested index digest to point the tags at
    required: true
  tags:
    description: Newline-separated tags to publish
    required: true

runs:
  using: composite
  steps:
    - name: Promote
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        TAGS: ${{ inputs.tags }}
      run: |
        set -euo pipefail
        "$(cd -- "${GITHUB_ACTION_PATH}/../../.." && pwd)/scripts/actions/promote-tags.sh"
