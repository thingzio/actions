name: Verify image
description: >-
  Verifies that an image carries the provenance and SBOM attestations these
  workflows produce, and that they were signed by the expected build definition.

# This is the consumer-facing contract expressed as code. The selftest workflow
# runs it against every image it builds, so the verification commands published
# in the README are proven on each pull request rather than documented and left
# to rot.
#
# Two independent checks, on purpose:
#
#   gh attestation verify  -- the first-party path. --repo says where to fetch
#       the attestation (always the caller's repository), --signer-repo and
#       --signer-workflow assert who signed it (always the reusable workflow).
#       Trusting the caller repository for storage but the signer repository for
#       identity is the whole point: a consumer cannot mint provenance that
#       claims this build definition produced their image.
#
#   cosign verify-attestation -- the SBOM path, pinned to a platform manifest.
#       The certificate identity is the reusable workflow's job_workflow_ref,
#       which Fulcio records as the Build Signer URI (OID 1.3.6.1.4.1.57264.1.9)
#       and as the certificate SAN. The regexp is anchored on the workflow path
#       and left open at the ref so it matches both a @refs/tags/vX.Y.Z pin and
#       a @<sha> pin.

inputs:
  image_ref:
    description: Immutable <image>@<digest> reference to verify
    required: true
  repo:
    description: >-
      owner/repo that owns the attestation, i.e. the repository whose workflow
      called the builder. Defaults to the current repository.
    required: false
    default: ''
  signer_repo:
    description: owner/repo containing the reusable workflow that signed
    required: false
    default: thingzio/actions
  signer_workflow:
    description: Path of the reusable workflow that signed
    required: true
  platform_digests:
    description: >-
      JSON object mapping platform to child manifest digest. When set, each
      platform's CycloneDX attestation is verified too.
    required: false
    default: '{}'
  github_token:
    description: Token used by the GitHub CLI to fetch attestations
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Verify build provenance
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image_ref }}
        REPO: ${{ inputs.repo != '' && inputs.repo || github.repository }}
        SIGNER_REPO: ${{ inputs.signer_repo }}
        SIGNER_WORKFLOW: ${{ inputs.signer_workflow }}
        GH_TOKEN: ${{ inputs.github_token != '' && inputs.github_token || github.token }}
      run: |
        set -euo pipefail
        "$(cd -- "${GITHUB_ACTION_PATH}/../../.." && pwd)/scripts/actions/verify-image.sh" provenance

    - name: Verify SBOM attestations
      if: inputs.platform_digests != '{}'
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image_ref }}
        REPO: ${{ inputs.repo != '' && inputs.repo || github.repository }}
        SIGNER_REPO: ${{ inputs.signer_repo }}
        SIGNER_WORKFLOW: ${{ inputs.signer_workflow }}
        PLATFORM_DIGESTS: ${{ inputs.platform_digests }}
      run: |
        set -euo pipefail
        "$(cd -- "${GITHUB_ACTION_PATH}/../../.." && pwd)/scripts/actions/verify-image.sh" sbom
