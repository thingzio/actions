name: Resolve digests
description: >-
  Resolves the index digest and each per-platform child manifest digest for a
  pushed tag, and fails closed if the result is not the shape the build claimed.

# `crane digest <ref>` returns the multi-platform index digest, which is the
# right subject for provenance and the wrong one for an SBOM: an SBOM describes
# exactly one root filesystem, and a consumer that resolved linux/amd64
# enumerates referrers on that child manifest, not on the index.
#
# `crane digest --platform` resolves the index to a child and errors if the
# platform is absent, so a release that silently lost an architecture fails here
# rather than shipping two SBOMs pinned to the same subject.

inputs:
  image:
    description: Full image name including registry, without tag or digest
    required: true
  tag:
    description: Tag to resolve, normally the candidate tag
    required: true
  platforms:
    description: JSON array of {platform, arch, runner} from validate-inputs
    required: true

outputs:
  index_digest:
    description: >-
      Digest of the multi-platform index, or of the single manifest when only
      one platform was built. Subject for build provenance.
    value: ${{ steps.resolve.outputs.index_digest }}
  platform_digests:
    description: >-
      JSON object mapping each platform to its child manifest digest. Subjects
      for the per-platform CycloneDX attestations.
    value: ${{ steps.resolve.outputs.platform_digests }}
  expect_index:
    description: '"true" when more than one platform was built'
    value: ${{ steps.resolve.outputs.expect_index }}
  image_ref:
    description: Immutable <image>@<index-digest> reference
    value: ${{ steps.resolve.outputs.image_ref }}

runs:
  using: composite
  steps:
    - name: Resolve digests
      id: resolve
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        PLATFORMS_JSON: ${{ inputs.platforms }}
      run: |
        set -euo pipefail
        "$(cd -- "${GITHUB_ACTION_PATH}/../../.." && pwd)/scripts/actions/resolve-digests.sh"
