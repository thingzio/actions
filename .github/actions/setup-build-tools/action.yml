name: Setup build tools
description: >-
  Installs the pinned build and supply-chain tools onto the runner, verifying
  each download against the checksum manifest its project publishes.

# There is no `curl | bash` here and there must never be: a piped installer
# executes before anything can be verified, which is exactly the step these
# workflows exist to make auditable. Every binary goes through
# scripts/install-tool.sh, which fails closed on a checksum mismatch and deletes
# the artifact so a later step cannot run it anyway.
#
# Tools land in $RUNNER_TEMP/thingz-bin rather than /usr/local/bin so nothing
# needs sudo and so a tool installed here cannot shadow a system binary for any
# other job.

inputs:
  ko:
    description: ko version to install; empty to skip
    required: false
    default: ''
  crane:
    description: crane version to install; empty to skip
    required: false
    default: ''
  syft:
    description: syft version to install; empty to skip
    required: false
    default: ''
  cosign:
    description: cosign version to install; empty to skip
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Prepare the tool directory
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/thingz-bin"
        printf '%s\n' "${RUNNER_TEMP}/thingz-bin" >>"${GITHUB_PATH}"

    - name: Install ko
      if: inputs.ko != ''
      shell: bash
      env:
        TOOL_VERSION: ${{ inputs.ko }}
      run: |
        set -euo pipefail
        root="$(cd -- "${GITHUB_ACTION_PATH}/../../.." && pwd)"
        "${root}/scripts/install-tool.sh" ko "${TOOL_VERSION}" "${RUNNER_TEMP}/thingz-bin"

    - name: Install crane
      if: inputs.crane != ''
      shell: bash
      env:
        TOOL_VERSION: ${{ inputs.crane }}
      run: |
        set -euo pipefail
        root="$(cd -- "${GITHUB_ACTION_PATH}/../../.." && pwd)"
        "${root}/scripts/install-tool.sh" crane "${TOOL_VERSION}" "${RUNNER_TEMP}/thingz-bin"

    - name: Install syft
      if: inputs.syft != ''
      shell: bash
      env:
        TOOL_VERSION: ${{ inputs.syft }}
      run: |
        set -euo pipefail
        root="$(cd -- "${GITHUB_ACTION_PATH}/../../.." && pwd)"
        "${root}/scripts/install-tool.sh" syft "${TOOL_VERSION}" "${RUNNER_TEMP}/thingz-bin"

    # cosign comes from its own installer action rather than install-tool.sh.
    # The project signs its releases with its own keyless flow and the installer
    # verifies that chain, which is a stronger guarantee than a checksum file
    # fetched from the same host as the binary.
    - name: Install cosign
      if: inputs.cosign != ''
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      with:
        cosign-release: ${{ inputs.cosign }}

    - name: Report installed versions
      shell: bash
      run: |
        set -euo pipefail
        for tool in ko crane syft cosign; do
          if command -v "${tool}" >/dev/null 2>&1; then
            printf '%-8s %s\n' "${tool}" "$("${tool}" version 2>&1 | head -1)"
          fi
        done
