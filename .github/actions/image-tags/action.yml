name: Image tags
description: >-
  Derives the image tags for a build from the event context, plus the run-unique
  candidate tag the build publishes to before it is promoted.

# Builds publish to the candidate tag first and move the release tags onto the
# resulting digest only after attestation succeeds, so a failed signing step
# never leaves a published `latest`. The candidate tag is what makes that
# two-phase publish possible.

inputs:
  tags:
    description: >-
      Newline- or comma-separated tags that replace the derived set entirely.
      Leave empty to derive from the event.
    required: false
    default: ''

outputs:
  tags:
    description: Newline-separated release tags
    value: ${{ steps.derive.outputs.tags }}
  primary_tag:
    description: The first release tag, useful for logging and summaries
    value: ${{ steps.derive.outputs.primary_tag }}
  candidate_tag:
    description: Run-unique staging tag, candidate-<run-id>-<run-attempt>
    value: ${{ steps.derive.outputs.candidate_tag }}

runs:
  using: composite
  steps:
    - name: Derive tags
      id: derive
      shell: bash
      # Every value reaches the script through the environment. None of them is
      # interpolated into the shell body, so a branch named `$(id)` is data.
      env:
        TAGS_OVERRIDE: ${{ inputs.tags }}
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        "$(cd -- "${GITHUB_ACTION_PATH}/../../.." && pwd)/scripts/actions/image-tags.sh"
