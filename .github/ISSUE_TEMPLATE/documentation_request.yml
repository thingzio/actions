name: Documentation
description: Something is wrong, missing, or confusing in the docs
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Documentation fixes are always in scope and are the best way to make a
        first contribution. If something was confusing to you it was confusing
        to someone else, and you are the person best placed to fix it right now
        — a pull request is very welcome.

  - type: input
    id: where
    attributes:
      label: Where
      description: File, section, or URL.
      placeholder: docs/verification.md, "Verify the SBOM"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
      description: >
        If a documented command did not work, paste what you ran and what you
        got.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: What would be clearer
      description: Optional.
