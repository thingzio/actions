version: 2

# Every entry below carries a 7-day cooldown. Pinning by SHA proves that what
# runs is what was reviewed; it does not prove the thing reviewed was honest.
# The action compromises that actually happen -- tj-actions/changed-files is the
# canonical one -- are published, exploited, and yanked inside a few days, and a
# same-day Dependabot PR is how a repository volunteers to pin the bad commit.
# Waiting a week costs nothing here (nothing in this repository is a security
# patch that cannot wait) and puts every bump on the far side of the window in
# which those compromises get found.
#
# Only `default-days` is set. The semver-specific keys are unsupported by the
# github-actions and docker ecosystems, and splitting the gomod entry alone
# would buy asymmetry without buying safety.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # Dependabot only scans directories it is told about, and a composite action
  # carries its own `uses:` pins. Without an entry per action directory those
  # pins silently never get updates, which is how one repository ends up with
  # two different versions of the same action pinned in it.
  #
  # Only actions that actually contain a `uses:` are listed. Keep this in sync:
  #   grep -l 'uses:' .github/actions/*/action.yml
  - package-ecosystem: github-actions
    directory: .github/actions/registry-login
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: .github/actions/setup-build-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: .github/actions/sbom-attest
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # The Go fixture the selftest builds. It deliberately has no third-party
  # dependencies, so this exists to keep the declared Go version current rather
  # than to upgrade modules.
  - package-ecosystem: gomod
    directory: testdata/go-app
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]

  # The base image the Docker fixture is pinned to. Pinned by digest, which
  # means it goes stale silently unless something updates it.
  - package-ecosystem: docker
    directory: testdata/docker-app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
