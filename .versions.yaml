# Single source of truth for every tool version this repository installs.
#
# Local development and CI read the same values through scripts/versions.sh, so
# `make lint` on a laptop runs the same actionlint as the `ci` workflow. Nothing
# in this repository may hardcode a tool version; pass it in from here.
#
# Renovate and Dependabot open the bump PRs. The selftest workflow builds real
# images with the new versions and verifies the resulting attestations, so a
# broken bump fails before it merges.
#
# Format note: scripts/versions.sh is a small awk reader that supports exactly
# this shape -- two levels, scalar values, optional trailing "#" comments. Values
# may contain ":" (image references do) but may not contain "#".

tools:
  # Container image builders and supply-chain tooling.
  ko: v0.19.1
  crane: v0.22.1
  syft: v1.51.1

  # Cosign must stay >= v3.1.0. Earlier releases log DSSE attestations to Rekor
  # as the legacy "dsse" entry type, which sigstore-go cannot verify; from v3.1.0
  # they are logged to Rekor v2 as hashedrekord/PAE.
  cosign: v3.1.3

  # Repository linting. shellcheck is deliberately absent: it ships preinstalled
  # on GitHub-hosted Ubuntu runners and `brew install shellcheck` covers local
  # use, and its releases publish no checksum manifest to pin against.
  actionlint: v1.7.12
  yamllint: 1.38.0

images:
  # ko's own default base is cgr.dev/chainguard/static:latest. Naming it here
  # makes the default auditable and lets a single PR move every thingzio Go
  # image onto a different base.
  ko_default_base: cgr.dev/chainguard/static:latest
