# Single source of truth for every tool version this repository installs.
#
# Local development and CI read the same values through scripts/versions.sh, so
# `make lint` on a laptop runs the same actionlint as the `ci` workflow. Nothing
# in this repository may hardcode a tool version; pass it in from here.
#
# Renovate and Dependabot open the bump PRs. The selftest workflow builds real
# images with the new versions and verifies the resulting attestations, so a
# broken bump fails before it merges.
#
# Format note: scripts/versions.sh is a small awk reader that supports exactly
# this shape -- two levels, scalar values, optional trailing "#" comments. Values
# may contain ":" (image references do) but may not contain "#".

tools:
  # Container image builders and supply-chain tooling.
  ko: v0.19.1
  crane: v0.22.1
  syft: v1.51.1

  # Go binary releases. Consumed by the release-go reusable workflow.
  goreleaser: v2.18.1

  # Cosign must stay >= v3.1.0. Earlier releases log DSSE attestations to Rekor
  # as the legacy "dsse" entry type, which sigstore-go cannot verify; from v3.1.0
  # they are logged to Rekor v2 as hashedrekord/PAE.
  cosign: v3.1.3

  # Terraform/IaC misconfiguration scanning. tfsec, which the consuming
  # repositories used to run, is end of life -- its final release was v1.28.14
  # in May 2025 and the project directs users here, so its ruleset is frozen.
  trivy: v0.74.0

  # Repository linting.
  # golangci-lint is consumed by the lint-go reusable workflow, not installed
  # by install-tool.sh: golangci/golangci-lint-action fetches and caches it
  # itself, and running two installers for one tool is how versions drift.
  golangci_lint: v2.13.1
  actionlint: v1.7.12
  yamllint: 1.38.0

  # Unprefixed because both consumers want it that way: pip installs
  # zizmor==1.30.1 and zizmor-action pulls ghcr.io/zizmorcore/zizmor:1.30.1.
  #
  # This was floating. zizmor-action defaults `version: latest`, so CI silently
  # picked up whatever had shipped that morning -- and a release that added new
  # audits opened 40 code scanning alerts against a tree nobody had touched.
  # That is the drift this file exists to prevent, and it is worse for a
  # security scanner than a linter: the tool that decides whether the repository
  # is compliant must not change underneath it without a reviewable commit.
  #
  # `make lint-zizmor` runs this same version locally. Note that zizmor-action
  # resolves a version through a digest map baked into its own release, so a
  # bump here can need a zizmor-action bump alongside it.
  zizmor: 1.30.1

  # shellcheck publishes no checksums.txt, so its digests are pinned directly
  # below. That is stronger than the manifest path the other tools use, not
  # weaker: a checksums.txt is fetched from the same host as the binary, so it
  # attests to nothing an attacker who controls that host could not also forge.
  # These values were computed once and are reviewed on every bump.
  #
  # Pinning it at all is the point. shellcheck ships preinstalled on GitHub's
  # Ubuntu runners, and relying on that let CI and a laptop run different
  # versions -- which is exactly the drift "local development equals CI" exists
  # to prevent, and it produced a green local run and a red CI run.
  shellcheck: v0.11.0

checksums:
  shellcheck_linux_amd64: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
  shellcheck_linux_arm64: 68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc
  shellcheck_darwin_amd64: c2c15e08df0e8fbc374c335b230a7ee958c313fa5714817a59aa59f1aa594f51
  shellcheck_darwin_arm64: 339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f

images:
  # ko's own default base is cgr.dev/chainguard/static:latest. Naming it here
  # makes the default auditable and lets a single PR move every thingzio Go
  # image onto a different base.
  ko_default_base: cgr.dev/chainguard/static:latest
